[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "knobs"
version = "1.2.1"
description = "Choose a black-box solver's numerical parameters for a target accuracy in a chosen observable, at close to minimal cost."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.20,<2", "scipy>=1.12"]

[project.optional-dependencies]
paper = ["matplotlib>=3.5", "sympy>=1.9"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
