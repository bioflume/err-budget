[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "errbudget"
version = "2.0.0"
description = "Choose a black-box solver's numerical parameters for a target accuracy in one observable, at close to minimal cost."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Gökberk Kabacaoğlu", email = "gokberk.kabacaoglu@durham.ac.uk"}]
keywords = ["solution verification", "error budget", "solver tolerances", "numerical parameters", "discretisation error"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.20", "scipy>=1.12"]

[project.optional-dependencies]
yaml = ["pyyaml>=5"]
examples = ["matplotlib>=3.5"]
dev = ["pytest>=7", "pyyaml>=5", "sympy>=1.9"]

[project.scripts]
errbudget = "errbudget.cli:main"

[project.urls]
Repository = "https://github.com/bioflume/errbudget"
Article = "https://github.com/bioflume/errbudget-paper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
