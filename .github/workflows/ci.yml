name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    # pinned: ubuntu-latest is moving to Ubuntu 26.04, for which actions/python-versions has no Python 3.9 build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # the human-owned files (PROTECTED) must match the manifest the author keeps
      - run: python tools/check_protected.py
      - run: pytest -q
      - name: command-line example
        run: |
          cd examples/04_command_line
          errbudget check job.yaml
          errbudget run job.yaml --quiet
